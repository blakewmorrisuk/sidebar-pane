<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sidebar</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="app.css?v=3">
</head>
<body>
  <header>
    <h1>Sidebar</h1>
    <p class="sub" id="firm-line">Drafting companion</p>
  </header>

  <section id="attorney-section">
    <h2>Attorney</h2>
    <div class="slot-row" id="slot-row"></div>
    <div class="btn-row" id="attorney-row"></div>
  </section>

  <section id="defense-section">
    <h2>Defense bank</h2>
    <input type="search" id="def-search" placeholder="Search the bank..." autocomplete="off">
    <select id="def-part">
      <option value="">All parts</option>
    </select>
    <div id="def-list" class="scroll-list"></div>
  </section>

  <section id="current-section">
    <h2>In this document <button id="btn-refresh" class="link" title="Rescan the document">refresh</button></h2>
    <div id="cur-list" class="scroll-list short"></div>
  </section>

  <footer>
    <button id="btn-finalize">Finalize for filing</button>
    <p id="status" role="status"></p>
  </footer>

  <details id="diag">
    <summary>Diagnostics</summary>
    <div class="btn-row">
      <button id="btn-spike">Run storage spike</button>
      <button id="btn-census">Control census</button>
      <button id="btn-diag-copy">Copy results</button>
    </div>
    <pre id="diag-out"></pre>
  </details>

  <script src="app.js?v=3"></script>
</body>
</html>
